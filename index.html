<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Dubai's premier poker room. A premium gaming experience, a modern mobile platform, play on your schedule.">
  <title>Dubai's Premier Poker Room</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #080808;
      --black-soft: #10100f;
      --gold: #c6a96a;
      --gold-light: #e0cb98;
      --ivory: #f2eee5;
      --muted: #a7a196;
      --rule: rgba(198, 169, 106, .25);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--black); }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--black);
      color: var(--ivory);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .page {
      position: relative;
      isolation: isolate;
      display: flex;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(28px, 5.4vw, 76px);
      background:
        radial-gradient(ellipse at 76% 46%, rgba(198,169,106,.055), transparent 34rem),
        linear-gradient(115deg, #080808 0%, #0a0a09 54%, #0b0a08 100%);
    }
    .frame {
      position: absolute;
      inset: clamp(14px, 2.2vw, 30px);
      border: 1px solid rgba(198,169,106,.17);
      pointer-events: none;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 38px;
      height: 1px;
      background: var(--gold);
      opacity: .7;
    }
    .frame::before { top: -1px; left: 28px; }
    .frame::after { bottom: -1px; right: 28px; }
    .index {
      position: absolute;
      top: clamp(36px, 5vw, 68px);
      left: clamp(38px, 7vw, 100px);
      color: var(--gold);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .26em;
      text-transform: uppercase;
    }
    .index span { color: #777064; padding: 0 10px; }
    main {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(260px, .62fr);
      align-items: end;
      gap: clamp(48px, 9vw, 132px);
      padding-top: 54px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 28px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .3em;
      line-height: 1.6;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 34px; height: 1px; background: var(--gold); }
    h1 {
      margin: 0;
      max-width: 740px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(50px, 7.5vw, 100px);
      font-weight: 400;
      line-height: .94;
      letter-spacing: -.065em;
      text-wrap: balance;
    }
    h1 span {
      display: block;
      margin-top: .12em;
      color: var(--gold-light);
      font-weight: 400;
    }
    .benefits {
      list-style: none;
      margin: clamp(38px, 5.2vw, 60px) 0 0;
      padding: 0;
      border-top: 1px solid var(--rule);
    }
    .benefits li {
      display: flex;
      align-items: center;
      gap: 17px;
      min-height: 59px;
      padding: 15px 0;
      border-bottom: 1px solid var(--rule);
      color: #ddd7ca;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .005em;
      line-height: 1.5;
    }
    .number {
      min-width: 23px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .1em;
      font-variant-numeric: tabular-nums;
    }
    .action {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 2px;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      min-height: 64px;
      padding: 0 22px;
      border: 1px solid var(--gold);
      border-radius: 0;
      background: var(--gold);
      color: #11100d;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      transition: background-color .18s ease, color .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:hover { background: transparent; color: var(--gold-light); }
    .cta:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 5px; }
    .arrow { font-size: 19px; font-weight: 400; line-height: 1; }
    @media (max-width: 760px) {
      .page {
        align-items: center;
        padding: max(88px, env(safe-area-inset-top) + 52px) 28px max(44px, env(safe-area-inset-bottom));
      }
      .frame { inset: 12px; }
      .index { top: 34px; left: 30px; font-size: 9px; letter-spacing: .2em; }
      main {
        grid-template-columns: 1fr;
        gap: 34px;
        padding-top: 0;
        margin: auto 0;
      }
      .eyebrow { margin-bottom: 24px; font-size: 9px; letter-spacing: .24em; }
      h1 { font-size: clamp(47px, 12vw, 72px); line-height: .98; }
      .benefits { margin-top: 34px; }
      .benefits li { min-height: 56px; font-size: 13px; }
      .action { padding-bottom: 0; }
      .cta { min-height: 60px; padding-inline: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

    n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1399310622039113');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1399310622039113&ev=PageView&noscript=1" alt=""></noscript>
</head>
<body>
  <div class="page">
    <div class="frame" aria-hidden="true"></div>
    <div class="index">Dubai <span>/</span> Online Poker</div>
    <main>
      <section aria-labelledby="headline">
        <p class="eyebrow">A PREMIUM POKER EXPERIENCE</p>
        <h1 id="headline">Dubai’s Premier <span>Poker Room</span></h1>
        <ul class="benefits">
          <li><span class="number">01</span><span>A premium gaming experience</span></li>
          <li><span class="number">02</span><span>A modern mobile platform</span></li>
          <li><span class="number">03</span><span>Play on your schedule</span></li>
        </ul>
      </section>
      <div class="action">
        <a class="cta" id="play-cta" href="https://t.me/+79kwBGM9VX9hYzVi" target="_blank" rel="noopener noreferrer">
          <span>PLAY NOW</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var cta = document.getElementById('play-cta');
      if (!cta) return;
      cta.addEventListener('click', function () {
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Contact', { content_name: 'Telegram play CTA' });
        }
      });
    }());
  </script>
</body>
</html>
